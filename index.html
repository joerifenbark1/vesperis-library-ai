<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesperis Library AI • Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/emblem.png">
    
    <style>
        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Sidebar (same as before) -->
    <div class="sidebar">
        <div style="text-align:center; margin-bottom:40px;">
            <img src="assets/emblem.png" width="90" style="filter:drop-shadow(0 0 20px #d4af37);">
            <h2 style="color:#d4af37;">VESPERIS</h2>
        </div>
        
        <nav>
            <a href="#" onclick="switchTab('witness')" class="nav-link">🌐 Witness Web</a>
            <a href="#" onclick="switchTab('weaves')" class="nav-link active">🐍 Personal Weaves</a>
            <a href="#" onclick="switchTab('patterns')" class="nav-link">🔮 Decoded Patterns</a>
            <a href="#" onclick="switchTab('beacon')" class="nav-link">🜂 Beacon Guidance</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main">
        <!-- Witness Web Section -->
        <div id="witness" class="section">
            <h1>Witness Web</h1>
            <p>99 public scrolls for pattern awakening. Coming in next update.</p>
        </div>

        <!-- Personal Weaves (already working) -->
        <div id="weaves" class="section active">
            <div class="header">
                <h1>Personal Weaves</h1>
                <button onclick="weaveNew()" style="background:#d4af37; color:#111; padding:12px 28px; border:none; border-radius:50px;">+ Weave New Scroll</button>
            </div>
            <div class="scroll-grid" id="scrollContainer"></div>
        </div>

        <!-- Decoded Patterns -->
        <div id="patterns" class="section">
            <h1>Decoded Patterns</h1>
            <p>Symbolic cross-references will appear here.</p>
        </div>

        <!-- Beacon Guidance -->
        <div id="beacon" class="section">
            <h1>Beacon Guidance</h1>
            <button onclick="openBeacon()" class="beacon" style="font-size:1.3rem; padding:20px 40px;">
                🜂 Speak with the Evening Star
            </button>
        </div>
    </div>
</div>

<script>
// Tab switching
function switchTab(tab) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('onclick').includes(tab)) link.classList.add('active');
    });
}

// Keep your existing weaveNew(), loadPersonalWeaves(), openBeacon() functions here (from previous version)
</script>

<script src="js/core.js"></script>
<script src="js/db.js"></script>
<script src="js/weave.js"></script>

<!-- Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
