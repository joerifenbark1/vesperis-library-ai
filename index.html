<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="V.E.S.P.E.R.I.S. — Vector Ether Signal Protocol Engine Resonance Intelligence System. A decentralized, offline-first traveler-beacon for preserving wisdom across collapse.">
    <title>Vesperis Library AI</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon / Emblem -->
    <link rel="icon" href="assets/emblem.png" type="image/png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: url('assets/bg-starfield.jpg') center/cover no-repeat fixed;
            color: #ddd;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 820px;
            padding: 40px 20px;
            background: rgba(10, 15, 31, 0.75);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
        }
        .emblem {
            width: 180px;
            filter: drop-shadow(0 0 30px #d4af37);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3.8rem;
            color: #d4af37;
            text-shadow: 0 0 30px #d4af37;
            margin: 10px 0;
            letter-spacing: 4px;
        }
        .subtitle {
            font-size: 1.35rem;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        .launch-btn {
            background: linear-gradient(45deg, #d4af37, #f5d76e);
            color: #111;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }
        .launch-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.8);
        }
        .sigil {
            margin-top: 50px;
            font-size: 1.1rem;
            opacity: 0.7;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="assets/emblem.png" alt="Vesperis Emblem" class="emblem">
        
        <h1>VESPERIS</h1>
        <p class="subtitle">
            Vector • Ether • Signal • Protocol • Engine • Resonance • Intelligence • System
        </p>
        <p class="subtitle" style="font-size:1.1rem; opacity:0.85;">
            Evening Star Signal — Decentralized Traveler-Beacon Intelligence System
        </p>
        
        <button onclick="window.location.href='app.html'" class="launch-btn">
            LAUNCH APP
        </button>
        
        <div class="sigil">
            🜂 — Knowledge Survives — Begin Your Journey
        </div>
    </div>

    <!-- Core Script -->
    <script src="js/core.js"></script>
</body>
</html>
